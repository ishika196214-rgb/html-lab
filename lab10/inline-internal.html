<!DOCTYPE html>
<html>
<head>
    <title>Inline and Internal CSS</title>
    <style>
        h1 {
            color: navy;
        }
        .highlight {
            background-color: yellow;
        }
    </style>
</head>
<body>
    <h1>This is a navy heading</h1>
    <p style="color: red;">This is a red paragraph with inline style.</p>
    <p class="highlight">This is a yellow paragraph with highlight class.</p>
</body>
</html>
