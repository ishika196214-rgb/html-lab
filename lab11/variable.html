<!DOCTYPE html>
<html>
<head>
<title>CSS Variables</title>
<style>
:root {
  --main-color: #1d3557;
  --accent-color: #e63946;
  --page-padding: 20px;
}
body {
  color: var(--main-color);
  padding: var(--page-padding);
  font-family: Arial, sans-serif;
}
h1 {
  color: var(--accent-color);
}
</style>
</head>
<body>
  <h1>The heading uses the accent colour.</h1>
  <p>The text uses the main colour.</p>
</body>
</html>
