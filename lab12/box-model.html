<!DOCTYPE html>
<html>
<head>
<title>Box Model</title>
<style>
.box {
  width: 200px;
  padding: 20px;
  border: 5px solid black;
  background: lightblue;
  margin-bottom: 20px;
}
.content-box {
  box-sizing: content-box;
}
.border-box {
  box-sizing: border-box;
  background: lightcoral;
}
</style>
</head>
<body>
  <div class="box content-box">Content-box (total width 250px)</div>
  <div class="box border-box">Border-box (total width 200px)</div>
  <p>The content-box box is wider than the border-box box.</p>
</body>
</html>
