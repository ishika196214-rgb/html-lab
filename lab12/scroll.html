<!DOCTYPE html>
<html>
<head>
<title>Scroll</title>
<style>
.scroll-box {
  height: 120px;
  overflow: auto;
  border: 1px solid black;
  width: 200px;
  padding: 10px;
}
</style>
</head>
<body>
  <div class="scroll-box">
    <p>Line 1</p>
    <p>Line 2</p>
    <p>Line 3</p>
    <p>Line 4</p>
    <p>Line 5</p>
  </div>
  <p>The lines do not fit in the box, so the box can be scrolled.</p>
</body>
</html>
