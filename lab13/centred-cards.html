<!DOCTYPE html>
<html>
<head>
<title>Centred Cards</title>
<style>
.row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 15px;
  height: 200px;
  background: #f1f1f1;
}
.card {
  border: 1px solid black;
  border-radius: 8px;
  padding: 15px;
  width: 100px;
  text-align: center;
  background: white;
}
</style>
</head>
<body>
  <div class="row">
    <div class="card"><h3>Starter</h3><p>199</p></div>
    <div class="card"><h3>Standard</h3><p>349</p></div>
    <div class="card"><h3>Premium</h3><p>499</p></div>
  </div>
</body>
</html>
