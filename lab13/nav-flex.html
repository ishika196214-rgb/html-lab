<!DOCTYPE html>
<html>
<head>
<title>Nav Flex</title>
<style>
nav {
  display: flex;
  gap: 20px;
  background: #1d3557;
  padding: 15px;
}
nav a {
  color: white;
  text-decoration: none;
}
</style>
</head>
<body>
  <nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Events</a>
    <a href="#">Contact</a>
  </nav>
  <p>A dark bar with four white links side by side.</p>
</body>
</html>
