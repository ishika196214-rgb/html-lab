<!DOCTYPE html>
<html>
<head>
<title>Wrapping Cards</title>
<style>
.row {
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
}
.card {
  border: 1px solid #333;
  border-radius: 8px;
  padding: 15px;
  width: 120px;
  background: #e0fbfc;
}
</style>
</head>
<body>
  <h2>Stationery Shop</h2>
  <div class="row">
    <div class="card"><h3>Notebook</h3><p>price 60</p></div>
    <div class="card"><h3>Pen</h3><p>price 15</p></div>
    <div class="card"><h3>Bag</h3><p>price 350</p></div>
    <div class="card"><h3>Book</h3><p>price 120</p></div>
  </div>
  <p>Narrow the window to see wrapping.</p>
</body>
</html>
