<!DOCTYPE html>
<html>
<head>
<title>Grid First</title>
<style>
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
}
.box {
  background: #a8dadc;
  border: 1px solid black;
  padding: 20px;
  text-align: center;
}
</style>
</head>
<body>
  <div class="grid">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>
    <div class="box">6</div>
  </div>
  <p>Six boxes in two rows of three, with small gaps.</p>
</body>
</html>
