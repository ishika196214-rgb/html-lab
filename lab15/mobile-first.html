<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile First</title>
<style>
.cards {
  display: grid;
  gap: 15px;
}
.card {
  border: 1px solid black;
  border-radius: 8px;
  padding: 15px;
  background: #f1faee;
}
@media (min-width: 600px) {
  .cards {
    grid-template-columns: 1fr 1fr;
  }
}
</style>
</head>
<body>
  <div class="cards">
    <div class="card">
      <h2>Card 1</h2>
      <p>This is first card content.</p>
    </div>
    <div class="card">
      <h2>Card 2</h2>
      <p>This is second card content.</p>
    </div>
  </div>
  <p>On phone cards stack. At 600px and up they sit side by side.</p>
</body>
</html>
