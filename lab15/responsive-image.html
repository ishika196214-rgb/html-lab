<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Image</title>
<style>
img {
  max-width: 100%;
  height: auto;
  border: 1px solid black;
}
</style>
</head>
<body>
  <h1>My Photo</h1>
  <img src="images/sample.jpg" alt="sample photo" width="600">
  <p>On narrow window picture shrinks to fit. On wide window it keeps its own size.</p>
</body>
</html>
