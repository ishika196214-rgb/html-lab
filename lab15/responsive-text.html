<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Text</title>
<style>
body {
  font-size: 1rem;
}
h1 {
  font-size: 1.5rem;
}
@media (min-width: 600px) {
  h1 {
    font-size: 2.5rem;
  }
}
</style>
</head>
<body>
  <h1>Club Heading</h1>
  <p>This is a paragraph with responsive text size.</p>
  <p>The heading is larger when window is 600px wide or more.</p>
</body>
</html>
